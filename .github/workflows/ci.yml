name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PyYAML (used by the Kubernetes manifest checker)
        run: pip install pyyaml==6.0.3
      - name: Repository consistency
        run: bash tools/check-repo.sh
      - name: Secret scan (no private-terms file in CI; run the scan locally too)
        run: bash tools/scan-secrets.sh .
      - name: Workflow audit
        run: python3 tools/check-workflows.py .github/workflows
      - name: Tool tests
        run: |
          set -e
          bash hooks/test_policy.sh
          bash tools/test_scan_secrets.sh
          bash tools/test_teardown_check.sh
          bash tools/test_ledger.sh
          bash tools/test_check_workflows.sh
          bash tools/test_check_repo.sh
          bash tools/test_review_terraform_plan.sh
          bash tools/test_check_k8s_manifest.sh

  ci-ok:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "A required job did not succeed"; exit 1
          fi
